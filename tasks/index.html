n into a log file on the host, and then clean up.\n\n## Requirements\n- Write a TypeScript/Node.js program that uses the `@daytonaio/sdk` package to talk to the real Daytona SaaS at `https://app.daytona.io/api`.\n- The program must perform these steps in order:\n  1. Read `run-id` from the `ZEALT_RUN_ID` environment variable and create a sandbox whose name is `git-ts-${run-id}`.\n  2. Use `sandbox.git.clone(...)` to clone `https://github.com/octocat/Spoon-Knife` into the absolute path `/home/daytona/spoon-knife` inside the sandbox.\n  3. Call `sandbox.git.status(...)` against the cloned path and obtain the current branch name.\n  4. Use `sandbox.process.executeCommand(\"ls /home/daytona/spoon-knife\")` to list the files at the root of the cloned repository.\n  5. Write the branch name and the file list to the log file on the host machine (the machine running the Node.js program), in the exact format described in the Acceptance Criteria.\n  6. Delete the sandbox before exiting (regardless of success or failure of intermediate steps where possible).\n- Use the real Daytona service; do not mock the SDK or any of its calls.\n- Authenticate using the `DAYTONA_API_KEY` environment variable.\n\n## Implementation Hints\n- Install `@daytonaio/sdk` from npm and import the `Daytona` client.\n- Configure the client with `apiKey: process.env.DAYTONA_API_KEY` and `serverUrl: 'https://app.daytona.io/api'`.\n- Pass an absolute path (starting with `/`) to `git.clone` and `git.status` to control exactly where the repo lives.\n- `sandbox.git.status(path)` returns an object whose `currentBranch` field holds the branch name.\n- `sandbox.process.executeCommand(...)` returns an object whose `result` field contains the stdout text; split it on whitespace/newlines to get the file names.\n- Build the file list value as the comma-separated names that appear in `ls` output (trimmed, ignoring empty entries); order does not matter.\n- Use `try/finally` (or equivalent) so that the sandbox is deleted even when an error occurs.\n\n## Acceptance Criteria\n- Project path: /home/user/myproject\n- Log file: /home/user/myproject/output.log\n- The TypeScript program creates a sandbox named `git-ts-${run-id}` where `run-id` is read from the `ZEALT_RUN_ID` environment variable.\n- The repository `https://github.com/octocat/Spoon-Knife` is cloned into `/home/daytona/spoon-knife` inside the sandbox using `sandbox.git.clone`.\n- The log file `/home/user/myproject/output.log` contains exactly two informational lines, in any order:\n  - A line of the form `Branch: \u003cbranch_name\u003e` produced from `sandbox.git.status(...)`.\n  - A line of the form `Files: \u003ccomma-separated names\u003e` produced from `sandbox.process.executeCommand(\"ls /home/daytona/spoon-knife\")`. The list must include every entry returned by `ls`, separated by `, ` (comma followed by a space) or `,` (comma only). Order is not significant.\n- After the program finishes, the sandbox named `git-ts-${run-id}` no longer exists in the Daytona account.\n\n"])</script><script>self.__next_f.push([1,"17:T8c4,"])</script><script>self.__next_f.push([1,"# List Daytona Sandboxes with the Daytona CLI\n\n## Background\nYou are working with the [Daytona](https://www.daytona.io/docs/en/tools/cli) CLI, which provides command-line access to Daytona's managed sandbox service. In this task you will authenticate, create a uniquely-named sandbox, list all sandboxes belonging to the current account, and persist the listing JSON together with a summary line describing the created sandbox.\n\n## Requirements\n- Authenticate the Daytona CLI using the API key stored in the `DAYTONA_API_KEY` environment variable.\n- Create a new sandbox whose name is `lst-${ZEALT_RUN_ID}` (where `ZEALT_RUN_ID` is the run identifier read from the environment).\n- Capture the full JSON listing of sandboxes for the authenticated account into a file under the project directory.\n- Record a one-line human-readable summary about the freshly created sandbox in a log file.\n\n## Implementation Hints\n- Use `daytona login --api-key $DAYTONA_API_KEY` to authenticate non-interactively.\n- Use `daytona create --name \u003cname\u003e` to create the sandbox; the default snapshot is fine.\n- Use `daytona list --format json` to obtain machine-readable output, then process the JSON with a tool like `jq` to extract the id of the sandbox you just created.\n- Write the entire `daytona list --format json` output to `sandboxes.json` and the one-line summary to `output.log`.\n- The whole flow should be a short shell script (2-5 commands) and may optionally clean up the sandbox afterwards.\n\n## Acceptance Criteria\n- Project path: /home/user/myproject\n- Log file: /home/user/myproject/output.log\n- Sandboxes JSON file: /home/user/myproject/sandboxes.json\n- The Daytona CLI must be authenticated using `DAYTONA_API_KEY` from the environment.\n- A sandbox named `lst-${ZEALT_RUN_ID}` (with `ZEALT_RUN_ID` read from the environment) must exist in the account by the time the task finishes.\n- `sandboxes.json` must contain the verbatim JSON output of `daytona list --format json` and must include an entry whose name matches `lst-${ZEALT_RUN_ID}`.\n- `output.log` must contain a single line in the exact format: `Created: lst-\u003crun-id\u003e with id \u003csandbox-id\u003e`, where `\u003csandbox-id\u003e` is the id of the created sandbox as reported by `daytona list --format json`.\n\n"])</script><script>self.__next_f.push([1,"18:Tabc,"])</script><script>self.__next_f.push([1,"# Generate Signed Preview URL for a Sandbox HTTP Server\n\n## Background\nYou have the Daytona CLI installed and a real Daytona SaaS API key available. Daytona sandboxes expose preview URLs that allow accessing services running inside the sandbox over the public internet. You need to programmatically spin up a sandbox, start a simple HTTP server inside it, obtain a signed preview URL via the CLI, and verify the URL serves the expected content.\n\n## Requirements\n- Write a shell script that uses the Daytona CLI end-to-end.\n- Authenticate with Daytona using the API key in the `DAYTONA_API_KEY` environment variable.\n- Create a new sandbox whose name is derived from the current `run-id`.\n- Inside the sandbox, start a simple HTTP server on port `8000` that serves a single file whose content is derived from the current `run-id`.\n- Obtain a signed preview URL for port `8000` via the Daytona CLI.\n- Fetch the preview URL with `curl` from the task environment (not the sandbox) and persist both the URL and the response body to disk.\n\n## Implementation Hints\n- Read the current `run-id` from the `ZEALT_RUN_ID` environment variable.\n- The sandbox name must be `prev-${ZEALT_RUN_ID}`.\n- The HTTP server must serve a file whose body contains the exact string `HELLO_${ZEALT_RUN_ID}`.\n- Use `daytona login --api-key $DAYTONA_API_KEY` to authenticate before any other CLI calls.\n- Use `daytona create --name prev-${ZEALT_RUN_ID}` to create the sandbox.\n- Use `daytona exec` to run commands inside the sandbox. Because `daytona exec` is synchronous, you must launch the HTTP server in a way that detaches it from the exec session (for example, with `nohup ... \u0026` and redirected output, or `setsid`/`disown`), so the exec call returns while the server keeps running. `python3 -m http.server 8000` is a convenient server choice.\n- Use `daytona preview-url prev-${ZEALT_RUN_ID} --port 8000` to retrieve a signed preview URL. The URL may be the entire stdout, or you may need to parse it.\n- The signed preview URL embeds an authentication token, so plain `curl \u003curl\u003e` should succeed without extra headers.\n\n## Acceptance Criteria\n- Project path: /home/user/myproject\n- Log file: /home/user/myproject/output.log\n- The current `run-id` must be read from the `ZEALT_RUN_ID` environment variable.\n- A sandbox named `prev-${ZEALT_RUN_ID}` must exist in the Daytona account associated with `DAYTONA_API_KEY` after the task runs.\n- The log file must contain a line in the format: `Preview URL: \u003curl\u003e` where `\u003curl\u003e` is the signed preview URL returned by `daytona preview-url`.\n- The file `/home/user/myproject/preview-response.txt` must contain the body returned by fetching the preview URL with `curl`. Its content must include the string `HELLO_${ZEALT_RUN_ID}`.\n\n"])</script><script>self.__next_f.push([1,"19:Ta49,"])</script><script>self.__next_f.push([1,"# Stateful Shell Sessions with the Daytona Python SDK\n\n## Background\nDaytona sandboxes expose a `process` module that supports stateful shell sessions. Unlike one-shot command execution, a session preserves the shell's working directory, environment variables, and other process state across multiple commands, allowing you to script multi-step workflows that depend on each other.\n\nIn this task, you will use the Daytona Python SDK to spin up a real sandbox, drive a single shell session through a sequence of state-dependent commands, capture each command's stdout via the session log API, and persist the results to a log file before tearing everything down.\n\n## Requirements\n- Use the official Daytona Python SDK (`pip install daytona`) and authenticate via the `DAYTONA_API_KEY` environment variable.\n- Create a new sandbox whose name includes the current `run-id` so concurrent trials do not collide.\n- Inside that sandbox, create a single named shell session and run a sequence of commands within it so that environment variables and working directory persist across calls.\n- Retrieve each command's logs through the session log API and append summary lines to a log file on the local task host.\n- Clean up by deleting the session and the sandbox once the work has been recorded.\n\n## Implementation Hints\n- Read `run-id` from the `ZEALT_RUN_ID` environment variable and use it as a suffix when naming the sandbox and as content inside the exported variable.\n- Look at the Daytona Python SDK methods on `sandbox.process`: `create_session`, `execute_session_command`, `get_session_command_logs`, and `delete_session`.\n- The `execute_session_command` call accepts a `SessionExecuteRequest` describing the command to run; the returned object exposes a command id you can use to fetch logs.\n- Make sure you reuse the same session id for every command so that `cd` and `export` carry over to the subsequent `pwd` and `echo` calls.\n- Strip surrounding whitespace from each command's stdout before writing it into the log file.\n\n## Acceptance Criteria\n- Project path: /home/user/myproject\n- Log file: /home/user/myproject/output.log\n- Sandbox name: `sess-${ZEALT_RUN_ID}` (created and then deleted by the task).\n- Session name inside the sandbox: `mysession` (created and then deleted by the task).\n- The session must be used to run, in order, the equivalent of: `cd /tmp`, `export MYVAR=session-${ZEALT_RUN_ID}`, `pwd`, and `echo $MYVAR`.\n- The log file must contain exactly two lines in this order:\n  - `PWD: \u003cpwd output\u003e`\n  - `MYVAR: \u003cecho output\u003e`\n  where each `\u003c...\u003e` is the trimmed stdout of the corresponding session command.\n\n"])</script><script>self.__next_f.push([1,"1a:T9c4,"])</script><script>self.__next_f.push([1,"# Create a Daytona Sandbox with Custom Environment Variables (Python SDK)\n\n## Background\nDaytona is a platform that provides secure, isolated sandboxes for running code. The Python SDK lets you programmatically create sandboxes with custom environment variables and execute commands inside them. This is essential for running code with configuration-specific settings (e.g., production mode flags or per-run secrets).\n\nIn this task, you will use the Daytona Python SDK to create a sandbox configured with custom environment variables, then verify that those variables are available inside the sandbox by executing shell commands.\n\n## Requirements\n- Write a Python script that uses the Daytona Python SDK to:\n  1. Create a sandbox with two custom environment
